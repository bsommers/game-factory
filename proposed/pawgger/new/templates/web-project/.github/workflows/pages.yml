name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Assemble site (docs/ plus the playable game under play/)
        run: |
          rm -rf _site && mkdir -p _site/play
          cp -r docs/. _site/
          cp index.html style.css _site/play/
          cp -r src _site/play/src
          [ -d assets ] && cp -r assets _site/play/assets || true
          touch _site/.nojekyll
          test -s _site/index.html && test -s _site/play/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
